<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ecos da Escuridão - Saída</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/cena.css">
  <link rel="stylesheet" href="css/hud.css">
</head>

<!-- Use class="debug" no body para ver as áreas clicáveis. -->
<body onkeydown="tecla(event)">

  <div id="palco" style="background-image: url('images/saida.png')" onmousemove="moverLanterna(event)">
    <span class="nome-cena">Saída</span>

    <!-- Áreas clicáveis -->
    <div class="campo" id="campo-leitor" title="Leitor magnético"
         style="left:8%; top:36%; width:10%; height:18%"
         onclick="clicarLeitor()">

    </div>

    <div class="campo" id="campo-teclado" title="Painel de setas"
         style="left:24%; top:36%; width:11%; height:18%"
         onclick="clicarPainelSetas()">

    </div>

    <div class="campo" id="campo-portao" title="Portão"
         style="left:44%; top:12%; width:22%; height:70%"
         onclick="clicarPortao()">

    </div>

    <div class="campo" id="campo-sombra" title="A Sombra"
         style="left:76%; top:14%; width:14%; height:66%"
         onclick="clicarSombra()">

    </div>

    <!-- Lanterna -->
    <div id="luz"></div>

    <!-- Interface do jogo -->
    <div id="topo">
      <button id="botao-diario" onclick="abrirDiario()" hidden>Diário</button>
      <div id="inv">
          <span class="titulo-inventario">Itens</span>
          <a href="#" class="item-inventario" id="item-chavefenda" style="display:none" onclick="clicarItem('chavefenda'); return false;">Chave de fenda</a>
          <a href="#" class="item-inventario" id="item-alicate" style="display:none" onclick="clicarItem('alicate'); return false;">Alicate</a>
          <a href="#" class="item-inventario" id="item-chave" style="display:none" onclick="clicarItem('chave'); return false;">Chave de latão</a>
          <a href="#" class="item-inventario" id="item-fusivel" style="display:none" onclick="clicarItem('fusivel'); return false;">Fusível</a>
          <a href="#" class="item-inventario" id="item-cartao" style="display:none" onclick="clicarItem('cartao'); return false;">Cartão de acesso</a>
          <a href="#" class="item-inventario" id="item-corrente" style="display:none" onclick="clicarItem('corrente'); return false;">Corrente de prata</a>
          <a href="#" class="item-inventario" id="item-pingente" style="display:none" onclick="clicarItem('pingente'); return false;">Pingente</a>
          <a href="#" class="item-inventario" id="item-medalhao" style="display:none" onclick="clicarItem('medalhao'); return false;">Medalhão</a>
        </div>
    </div>

    <div id="rodape">
      <div id="mensagem"></div>
      <div id="baixo">
        <div id="nav">
          <button onclick="irPara('cena3.html')">Voltar ao corredor</button>
        </div>

      </div>
    </div>

    <!-- Painéis -->
    <div id="painel">

      <div class="subpainel" id="p-setas">
        <h3 id="setas-titulo"></h3>
        <p class="setas" id="setas-texto"></p>
        <p id="setas-dica"></p>
      </div>

      <div class="subpainel" id="p-diario">
        <h3>DIÁRIO DE BORDO</h3>
        <div id="diario-aberto">
          <section id="pagina-diario" class="pagina-diario esquerda">
            <h4 id="diario-titulo"></h4>
            <p id="diario-texto"></p>
          </section>
        </div>
        <div id="controles-diario">
          <button id="seta-diario-voltar" class="seta-diario" onclick="passarPaginaDiario(-1)" aria-label="Página anterior" disabled>&#8592;</button>
          <span id="diario-pagina">1 / 1</span>
          <button id="seta-diario-avancar" class="seta-diario" onclick="passarPaginaDiario(1)" aria-label="Próxima página">&#8594;</button>
        </div>
      </div>

      <button id="botao-fechar-painel" onclick="fecharPainel()">Fechar</button>
    </div>

  </div>

  <script src="js/jogo.js"></script>
  <script src="js/cena6.js"></script>
</body>
</html>
