<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ecos da Escuridão - Armazém</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/cena.css" />
  <link rel="stylesheet" href="css/hud.css" />
  <link rel="stylesheet" href="css/equipamentos.css" />
</head>

<body>
  <main id="travessia" class="cena-jogo com-equipamentos" data-requer-progresso="armazem">
    <div id="palco" style="background-image: url(&quot;images/armazem.png&quot;)" onmousemove="moverLanterna(event)">
      <h1 class="nome-cena" tabindex="-1">Armazém</h1>
      <button type="button" class="campo equipamento" id="campo-bateria"
        style="left: 66%; top: 38%; width: 20%; height: 20%" aria-label="Pegar bateria portátil"
        onclick="pegarBateria()">
        <img src="images/objetos/bateria-portatil.png" alt="" />
      </button>
      <div id="luz"></div>
      <div class="vinheta-breu" aria-hidden="true"></div>
      <div class="hud-tempo">
        <p id="tempo-restante" role="timer" aria-label="Tempo restante">
          4:00
        </p>
        <p id="sussurro" role="status"></p>
      </div>
      <aside id="inv" aria-label="Inventário">
        <span class="titulo-inventario">Itens</span>
        <span id="inventario-vazio">Vazio</span>
        <button type="button" id="inspecionar-item" onclick="inspecionarItem()" hidden>
          Inspecionar
        </button>
      </aside>
      <div id="rodape">
        <p id="mensagem" role="status"></p>
      </div>
      <button type="button" id="botao-diario" onclick="diario.abrir()" hidden>
        Diário
      </button>
      <div id="painel">
        <div class="subpainel" id="p-diario">
          <h2>DIÁRIO DE BORDO</h2>
          <div id="diario-aberto">
            <section id="pagina-diario" class="pagina-diario esquerda">
              <h3 id="diario-titulo">Anotação antiga</h3>
              <p id="diario-texto"></p>
            </section>
          </div>
          <div id="controles-diario">
            <button type="button" id="seta-diario-voltar" class="seta-diario" onclick="passarPaginaDiario(-1)"
              aria-label="Página anterior" disabled>
              ←
            </button>
            <span id="diario-pagina">1 / 1</span>
            <button type="button" id="seta-diario-avancar" class="seta-diario" onclick="passarPaginaDiario(1)"
              aria-label="Próxima página">
              &#8594;
            </button>
          </div>
        </div>
        <button type="button" id="botao-fechar-painel" onclick="fecharPainel()">
          Fechar
        </button>
      </div>
    </div>
    <nav aria-label="Navegação entre cenas">
      <button type="button" onclick="irPara('cena3.html')">
        Voltar ao corredor
      </button>
      <button type="button" class="botao-modo-claro" aria-pressed="false" onclick="alternarModoClaro()">
        Modo claro
      </button>
    </nav>
  </main>
  <script src="js/puzzles.js"></script>
  <script src="js/partida.js"></script>
  <script src="js/jogo.js"></script>
  <script src="js/cena5.js"></script>
</body>

</html>
