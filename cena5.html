<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ecos da Escuridão - Armazém</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/cena.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/equipamentos.css">
</head>
<body>
  <main id="travessia" class="com-equipamentos" data-requer-progresso="armazemAberto">
    <div id="palco" style="background-image: url('images/armazem.png')" onmousemove="moverLanterna(event)">
      <span class="nome-cena">Armazém</span>
      <button type="button" class="campo equipamento" id="campo-bateria"
        style="left:66%; top:52%; width:13%; height:13%" onclick="pegarBateria()">Bateria portátil</button>
      <div id="luz"></div>
      <div id="rodape"><p id="mensagem" role="status"></p></div>
    </div>
    <nav aria-label="Navegação entre cenas">
      <button type="button" onclick="irPara('cena3.html')">Voltar ao corredor</button>
    </nav>
    <div class="itens-travessia" role="group" aria-label="Ferramentas">
      <button type="button" class="item-inventario" id="item-pedecabra" style="display:none" onclick="clicarItem('pedecabra')">Pé de cabra</button>
      <button type="button" class="item-inventario" id="item-bateria" style="display:none" onclick="clicarItem('bateria')">Bateria portátil</button>
    </div>
  </main>
  <script src="js/jogo.js"></script>
  <script src="js/cena5.js"></script>
</body>
</html>
