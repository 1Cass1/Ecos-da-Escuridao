<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ecos da Escuridão - Corredor</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/cena.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/equipamentos.css">
</head>
<body>
  <main id="travessia" class="com-equipamentos">
    <div id="palco" style="background-image: url('images/corredor.png')" onmousemove="moverLanterna(event)">
      <span class="nome-cena">Corredor</span>
      <button type="button" class="campo equipamento" id="campo-porta-armazem"
        style="left:78%; top:36%; width:13%; height:38%" aria-label="Porta do Armazém"
        onclick="tentarAbrirArmazem()"></button>
      <button type="button" class="campo equipamento" id="campo-terminal"
        style="left:56%; top:39%; width:17%; height:16%" aria-label="Terminal da porta da frente"
        onclick="tentarPortaDaFrente()"></button>
      <div id="luz"></div>
      <aside id="inv" aria-label="Inventário">
        <span class="titulo-inventario">Itens</span>
        <span id="inventario-vazio">Vazio</span>
      </aside>
      <p class="narracao-cena">Uma meia-lua riscada marca a moldura do retrato no corredor.</p>
      <div id="rodape"><p id="mensagem" role="status"></p></div>
      <div id="painel">
        <div id="p-terminal" class="subpainel">
          <h3>Terminal da porta da frente</h3>
          <form onsubmit="tentarSenha(event)">
            <label for="senha-terminal">Dígitos dos canais 01 a 04</label>
            <input id="senha-terminal" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required>
            <button type="submit">Liberar porta</button>
          </form>
          <p id="resposta-terminal" role="status"></p>
        </div>
        <button type="button" id="botao-fechar-painel" onclick="fecharPainel()">Fechar</button>
      </div>
    </div>
    <nav aria-label="Navegação entre cenas">
      <button type="button" onclick="irPara('cena1.html')">Voltar ao quarto</button>
      <button type="button" onclick="irPara('cena4.html')">Sala de Segurança</button>
      <button type="button" onclick="tentarAbrirArmazem()">Armazém</button>
      <button type="button" onclick="tentarPortaDaFrente()">Porta da frente</button>
    </nav>
  </main>
  <script src="js/jogo.js"></script>
  <script src="js/cameras.js"></script>
  <script src="js/cena3.js"></script>
</body>
</html>
