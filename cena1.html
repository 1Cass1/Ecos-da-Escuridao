<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ecos da Escuridão - Quarto</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/cena.css">
  <link rel="stylesheet" href="css/hud.css">
</head>
<body>
  <main class="cena-jogo">
    <div id="palco" style="background-image: url('images/quarto.png')" onmousemove="moverLanterna(event)">
      <h1 class="nome-cena" tabindex="-1">Quarto</h1>

      <!-- Áreas clicáveis -->
      <button type="button" class="campo" id="campo-caixas"
        style="left:14%; top:47%; width:22%; height:38%" aria-label="Caixas"
        onclick="clicarCaixas()">
        <img src="images/objetos/caixas.png" alt="">
      </button>

      <button type="button" class="campo" id="campo-diario1"
        style="left:78%; top:60%; width:16%; height:24%" aria-label="Diário antigo"
        onclick="clicarDiario()">
        <img src="images/objetos/diario1.png" alt="">
      </button>

      <button type="button" class="campo" id="campo-escada"
        style="left:63%; top:38%; width:20%; height:40%" aria-label="Escada para baixo"
        onclick="clicarEscada()">
        <img src="images/objetos/escada.png" alt="">
      </button>

      <button type="button" class="campo" id="campo-bueiro"
        style="left:60%; top:81%; width:19%; height:19%" aria-label="Bueiro"
        onclick="clicarBueiro()">
        <img src="images/objetos/bueiro.png" alt="">
      </button>

      <button type="button" class="campo" id="campo-porta"
        style="left:44%; top:24%; width:12%; height:43%" aria-label="Porta"
        onclick="clicarPorta()"></button>

      <button type="button" class="campo" id="campo-cadeado"
        style="left:45%; top:41%; width:18%; height:18%" aria-label="Cadeado"
        onclick="clicarCadeado()">
        <img src="images/objetos/cadeado.png" alt="">
      </button>

      <!-- Lanterna -->
      <div id="luz"></div>
      <aside id="inv" aria-label="Inventário">
        <span class="titulo-inventario">Itens</span>
        <span id="inventario-vazio">Vazio</span>
      </aside>

      <!-- Interface do jogo -->
      <button type="button" id="botao-diario" onclick="abrirDiario()" hidden>Diário</button>

      <div id="rodape"><p id="mensagem" role="status"></p></div>

      <!-- Painéis -->
      <div id="painel">
        <div class="subpainel" id="p-parafuso">
          <h2>PARAFUSO DA GRADE</h2>
          <div id="parafuso"></div>
          <p>Giros: <span id="voltas-texto">0</span>/3</p>
          <div>
            <button type="button" onclick="girarParafuso('esquerda')">Girar para a esquerda</button>
            <button type="button" onclick="girarParafuso('direita')">Girar para a direita</button>
          </div>
        </div>

        <div class="subpainel" id="p-diario">
          <h2>DIÁRIO DE BORDO</h2>
          <div id="diario-aberto">
            <section id="pagina-diario" class="pagina-diario esquerda">
              <h3 id="diario-titulo">Anotação antiga</h3>
              <p id="diario-texto"></p>
            </section>
          </div>
          <div id="controles-diario">
            <button type="button" id="seta-diario-voltar" class="seta-diario" onclick="passarPaginaDiario(-1)" aria-label="Página anterior" disabled>&#8592;</button>
            <span id="diario-pagina">1 / 1</span>
            <button type="button" id="seta-diario-avancar" class="seta-diario" onclick="passarPaginaDiario(1)" aria-label="Próxima página">&#8594;</button>
          </div>
        </div>

        <button type="button" id="botao-fechar-painel" onclick="fecharPainel()">Fechar</button>
      </div>
    </div>
    <nav aria-label="Navegação entre cenas">
      <button type="button" onclick="clicarPorta()">Sair pela porta</button>
      <button type="button" class="botao-modo-claro" aria-pressed="false" onclick="alternarModoClaro()">Modo claro</button>
    </nav>
  </main>

  <script src="js/jogo.js"></script>
  <script src="js/cena1.js"></script>
</body>
</html>
